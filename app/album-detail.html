<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momenin — Detail Album Galeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <div class="app-layout">
    <aside class="sidebar">
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="proyek.html"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2-2h9a2 2 0 0 1 2 2z"/><path d="M1 13v4a2 2 0 0 0 2 2h4"/><path d="M12 11V7"/></svg><span>Proyek Saya</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link active" href="album.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span>Album</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="penyimpanan.html"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Penyimpanan</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="paket-saya.html"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Paket Saya</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="transaksi.html"><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span>Transaksi</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="pemesanan.html"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 8.3L12 13l8.7-4.7"/><path d="M12 13V21"/></svg><span>Permintaan</span></a></li>
        <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a></li>
      </ul>
    </aside>

    <div class="app-main">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:28px;">
        <div>
          <span class="section-eyebrow">Galeri Kenangan</span>
          <h2 class="section-title" id="album-title">Detail Album</h2>
          <p class="section-desc" id="album-desc">Media dokumentasi visual terkurasi.</p>
        </div>
        <button type="button" class="btn btn-primary" id="download-album-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Unduh Seluruh Album (.zip)</span>
        </button>
      </div>

      <div class="grid grid-3" id="album-media-grid">
        <div class="skeleton"><div class="skeleton-img"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div></div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.auth.requireLogin("user")) return;

      const params = new URLSearchParams(window.location.search);
      const albumId = params.get("id");
      const album = window.store.getById("albums", albumId);

      const titleEl = document.getElementById("album-title");
      const descEl = document.getElementById("album-desc");
      const grid = document.getElementById("album-media-grid");
      const dlAllBtn = document.getElementById("download-album-btn");

      if (!album) {
        titleEl.textContent = "Album Tidak Ditemukan";
        descEl.textContent = "Album yang Anda cari mungkin telah dipindahkan atau dihapus.";
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--c-muted);padding:40px;"><a href="album.html" class="btn btn-secondary">Kembali ke Daftar Album</a></p>';
        dlAllBtn.style.display = "none";
        return;
      }

      titleEl.textContent = album.name;
      descEl.textContent = album.description || "Dokumentasi visual kenangan Anda.";

      const mediaList = window.store.getAll("media").filter(m => m.albumId === album.id);

      if (!mediaList.length) {
        grid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;text-align:center;color:var(--c-muted);padding:40px;">Belum ada foto yang dimasukkan ke dalam album ini.</p>';
      } else {
        grid.innerHTML = mediaList.map(m => `
          <div class="card" style="overflow:hidden;box-shadow:var(--shadow-soft);">
            <div style="aspect-ratio:4/3;overflow:hidden;background:#eee;">
              <img src="${window.escapeHtml(m.image)}" alt="${window.escapeHtml(m.fileName)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'placeholder-img\\'>Foto Dokumentasi</div>';" loading="lazy">
            </div>
            <div class="card-body" style="padding:16px;">
              <div style="font-weight:600;margin-bottom:4px;font-size:0.95rem;">${window.escapeHtml(m.fileName)}</div>
              <div style="font-size:0.82rem;color:var(--c-muted);margin-bottom:12px;">${window.escapeHtml(m.type)} · ${window.formatBytes ? window.formatBytes(m.sizeBytes) : 'Resolusi Penuh'}</div>
              <button type="button" class="btn btn-secondary btn-sm" style="width:100%;" data-dl-single="${window.escapeHtml(m.fileName)}" data-dl-type="${window.escapeHtml(m.type)}">
                Unduh Foto
              </button>
            </div>
          </div>
        `).join("");

        grid.querySelectorAll("[data-dl-single]").forEach(btn => {
          btn.addEventListener("click", () => {
            const fileName = btn.getAttribute("data-dl-single");
            const fileType = btn.getAttribute("data-dl-type") || "image/jpeg";
            window.ui.downloadMockFile(fileName, fileType);
            window.ui.showToast(`Mengunduh foto ${fileName}...`, "success");
          });
        });
      }

      dlAllBtn.addEventListener("click", () => {
        window.ui.downloadMockFile(`${album.name}.zip`, "application/zip");
        window.ui.showToast(`Mengunduh arsip album "${album.name}.zip" dalam resolusi penuh...`, "success");
      });
    });
  </script>
</body>
</html>
