    </ul>
  </aside>

  <div class="app-main">
    <div id="content">
      <div class="section-header">
        <h2 class="section-title">Detail Proyek</h2>
        <p class="section-desc">Detail proyek dan album terkait.</p>
      </div>
      <div id="project-detail">
        <div class="grid grid-3">
          <div class="card"><div class="card-body">
            <h3 class="card-title">Informasi Proyek</h3>
            <p class="card-text" id="p-name">Memuat...</p>
            <p class="card-text" id="p-event">Event: ...</p>
            <p class="card-text" id="p-date">Tanggal: ...</p>
            <p class="card-text" id="p-location">Lokasi: ...</p>
            <p class="card-text" id="p-status">Status: ...</p>
          </div></div>
          <div class="card" style="grid-column: span 3;"><div class="card-body">
            <h3 class="card-title">Album Terkait</h3>
            <div id="project-albums"></div>
          </div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>

<script src="../js/data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const session = auth.getSession();
  const user = auth.getCurrentUser();
  const userId = session?.userId || (user && user.id);
  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  const project = store.getById({ type: "projects" }, id);
  if (!project || (!project.memberIds || !project.memberIds.includes(userId))) {
    location.href = "../app/proyek.html";
    return;
  }

  document.getElementById("p-name").textContent = project.name;
  document.getElementById("p-event").textContent = "Event: " + project.eventType;
  document.getElementById("p-date").textContent = "Tanggal: " + formatDate(project.eventDate);
  document.getElementById("p-location").textContent = "Lokasi: " + project.location;
  document.getElementById("p-status").textContent = "Status: " + project.status;

  const albums = store.getAll({ type: "albums" }).filter(a => a.projectId === id);
  const grid = document.getElementById("project-albums");
  if (!albums.length) {
    grid.innerHTML = '<p class="empty-state" style="text-align:center;color:var(--c-muted);">Belum ada album.</p>';
    return;
  }
  albums.forEach(a => {
    grid.innerHTML += `
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(a.name)}</h3>
          <p class="card-text">${escapeHtml(a.description)}</p>
          <a href="album-detail.html?id=${a.id}" class="btn btn-primary btn-sm">Buka Album</a>
        </div>
      </div>`;
  });
});

function formatDate(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString("id-ID");
}
</script>
</body>
</html>
