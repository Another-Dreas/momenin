<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momenin — Lupa Kata Sandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main style="padding:48px 0 80px;">
    <div class="container" style="max-width:500px;">
      <div class="section-header" style="margin-bottom:28px;">
        <span class="section-eyebrow">Pemulihan Akun</span>
        <h1 class="section-title" style="font-size:2.3rem;">Lupa Kata Sandi?</h1>
        <p class="section-desc">Masukkan alamat email Anda untuk menerima instruksi pemulihan kata sandi.</p>
      </div>

      <div class="card" style="box-shadow:var(--shadow-hover);">
        <div class="card-body" style="padding:32px;">
          <form id="lupa-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="lupa-email">Alamat Email *</label>
              <input type="email" class="form-input" id="lupa-email" required placeholder="nama@email.com" autocomplete="email">
              <span class="form-error" id="lupa-email-error" style="display:none;"></span>
            </div>

            <div id="lupa-feedback" style="display:none;padding:14px;background:#ebf2f8;border:1px solid #c6d9ea;border-radius:var(--radius-sm);font-size:0.9rem;color:var(--c-info);margin-bottom:20px;"></div>

            <button type="submit" class="btn btn-primary" id="btn-submit-lupa" style="width:100%;padding:13px;">
              <span>Kirim Tautan Atur Ulang</span>
            </button>
          </form>

          <div style="text-align:center;margin-top:24px;font-size:0.92rem;color:var(--c-muted);">
            Ingat kata sandi Anda? <a href="login.html" style="font-weight:600;">Kembali ke Masuk</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("lupa-form");
      const emailInput = document.getElementById("lupa-email");
      const emailErr = document.getElementById("lupa-email-error");
      const feedback = document.getElementById("lupa-feedback");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        emailErr.style.display = "none";
        feedback.style.display = "none";

        const email = emailInput.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          emailErr.textContent = "Masukkan format email yang valid.";
          emailErr.style.display = "block";
          return;
        }

        const msg = "Tautan atur ulang kata sandi telah dikirim ke email " + email + ". Silakan periksa kotak masuk atau spam Anda.";
        feedback.textContent = msg;
        feedback.style.display = "block";
        window.ui.showToast("Instruksi reset sandi berhasil dikirim ke email.", "info");
        emailInput.value = "";
      });
    });
  </script>
</body>
</html>
