  <div class="app-main">
    <div id="content">
      <div class="section-header">
        <h2 class="section-title">Album</h2>
        <p class="section-desc">Daftar album dokumentasi yang tersedia untuk Anda.</p>
      </div>
      <div class="grid grid-3" id="album-grid">
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>

<script src="../js/data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const session = auth.getSession();
  const user = auth.getCurrentUser();
  const userId = session?.userId || (user && user.id);
  if (!user || user.role !== "user") {
    location.href = "../login.html?next=" + encodeURIComponent(location.pathname);
    return;
  }

  const grid = document.getElementById("album-grid");
  const projects = store.getAll({ type: "projects" }).filter(p => p.memberIds.includes(userId));
  const albums = store.getAll({ type: "albums" }).filter(a => projects.some(p => p.id === a.projectId));

  grid.innerHTML = "";
  if (!albums.length) {
    grid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;text-align:center;color:var(--c-muted);">Belum ada album.</p>';
    return;
  }
  albums.forEach(a => {
    const cover = store.getAll({ type: "media" }).find(m => m.id === a.coverMediaId);
    grid.innerHTML += `
      <div class="card">
        <div class="card-img">${renderImage(cover?.image, a.name)}</div>
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(a.name)}</h3>
          <p class="card-text">${escapeHtml(a.description)}</p>
          <div style="display:flex;gap:8px;">
            <a href="album-detail.html?id=${a.id}" class="btn btn-primary btn-sm">Buka Album</a>
            <a href="proyek-detail.html?id=${a.projectId}" class="btn btn-secondary btn-sm">Lihat Proyek</a>
          </div>
        </div>
      </div>`;
  });
});

function renderImage(src, alt) {
  if (src && src.startsWith("http")) return `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy">`;
  if (src) return `<div class="placeholder-img">${escapeHtml(src)}</div>`;
  return `<div class="placeholder-img">Foto contoh</div>`;
}
</script>
</body>
</html>
