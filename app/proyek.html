<div class="app-layout">

      <li class="sidebar-nav-item"><a class="sidebar-nav-link active" href="proyek.html"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2-2h9a2 2 0 0 1 2 2z"/><path d="M1 13v4a2 2 0 0 0 2 2h4"/><path d="M12 11V7"/></svg><span>Proyek Saya</span></a></li>

      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a></li>

  <div class="app-main">
    <div id="content">
      <div class="section-header">
        <h2 class="section-title">Proyek Saya</h2>
        <p class="section-desc">Daftar proyek dokumentasi yang Anda miliki.</p>
      </div>

      <div class="filter-bar">
        <select id="status-filter" class="filter-select">
          <option value="">Semua Status</option>
          <option value="berjalan">Berjalan</option>
          <option value="selesai">Selesai</option>
          <option value="terjadwal">Terjadwal</option>
          <option value="dibatalkan">Dibatalkan</option>
        </select>
      </div>

      <div class="grid grid-3" id="proyek-grid">
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-text" style="height:1rem;"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-text" style="height:1rem;"></div></div>
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div><div class="skeleton-text" style="height:1rem;"></div></div>
      </div>

      <div class="empty-state" id="empty-state" style="display:none;text-align:center;padding:48px 24px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--c-muted-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--c-primary)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2z"/></svg>
        </div>
        <h3 style="font-size:1.3rem;margin-bottom:8px;color:var(--c-ink);">Belum Ada Proyek Dokumentasi</h3>
        <p style="color:var(--c-muted);font-size:0.95rem;max-width:440px;margin:0 auto 20px;">Ajukan layanan atau pesan paket dokumentasi untuk memulai proyek baru Anda.</p>
        <a href="pemesanan.html" class="btn btn-primary">Pesan Layanan Sekarang</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>

<script src="../js/data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const session = auth.getSession();
  const user = auth.getCurrentUser();
  const userId = session?.userId || (user && user.id);
  if (!user || user.role !== "user") {
    location.href = "../login.html?next=" + encodeURIComponent(location.pathname);
    return;
  }

  const grid = document.getElementById("proyek-grid");
  const emptyState = document.getElementById("empty-state");
  const statusFilter = document.getElementById("status-filter");
  let allProjects = store.getAll({ type: "projects" }).filter(p => p.memberIds.includes(userId));

  function render(list) {
    grid.innerHTML = "";
    if (!list.length) {
      emptyState.style.display = "block";
      grid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;text-align:center;color:var(--c-muted);">Tidak ada proyek yang cocok.</p>';
      return;
    }
    emptyState.style.display = "none";
    list.forEach(p => {
      const album = store.getAll({ type: "albums" }).find(a => a.projectId === p.id);
      grid.innerHTML += `
        <div class="card">
          <div class="card-body">
            <div class="badge ${p.status === "selesai" ? "badge-success" : p.status === "berjalan" ? "badge-info" : "badge-warning"} mb-3">${escapeHtml(p.status)}</div>
            <h3 class="card-title">${escapeHtml(p.name)}</h3>
            <p class="card-text">${escapeHtml(p.eventType)} · ${escapeHtml(p.location)} · ${formatDate(p.eventDate)}</p>
            ${album ? `<div class="card-text">Album: ${escapeHtml(album.name)}</div>` : ""}
            <div style="margin-top:12px;display:flex;gap:8px;">
              <a href="proyek-detail.html?id=${p.id}" class="btn btn-primary btn-sm">Detail</a>
              ${album ? `<a href="album-detail.html?id=${album.id}" class="btn btn-secondary btn-sm">Album</a>` : ""}
            </div>
          </div>
        </div>`;
    });
  }

  statusFilter.addEventListener("change", () => {
    const val = statusFilter.value;
    render(val ? allProjects.filter(p => p.status === val) : allProjects);
  });

  render(allProjects);
});

function formatDate(dateStr) {
  if (!dateStr) return "-";
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString("id-ID");
}
</script>
</body>
</html>
