<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momenin — Layanan Dokumentasi Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="hero" style="padding:60px 0 72px;">
      <div class="container hero-inner" style="grid-template-columns:1fr;text-align:center;">
        <div style="max-width:720px;margin:0 auto;">
          <span class="hero-pill">Layanan Terkurasi</span>
          <h1 class="hero-title" style="margin-bottom:16px;">Dokumentasi Penuh Makna</h1>
          <p class="hero-desc" style="margin:0 auto;">Momenin mengabadikan setiap rasa, senyum, dan kebersamaan melalui pendekatan dokumentasi hangat dan artistik.</p>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar" style="justify-content:center;margin-bottom:40px;">
          <div id="category-pills" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>

        <div class="grid grid-3" id="services-grid">
          <!-- Populated from store -->
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("services-grid");
      const pillsContainer = document.getElementById("category-pills");
      const allServices = window.store.getAll("services").filter(s => s.active !== false);

      const categories = ["Semua", ...new Set(allServices.map(s => s.category).filter(Boolean))];
      let activeCategory = "Semua";

      function renderPills() {
        pillsContainer.innerHTML = categories.map(cat => `
          <button type="button" class="btn ${cat === activeCategory ? 'btn-primary' : 'btn-secondary'} btn-sm" data-category="${window.escapeHtml(cat)}">
            ${window.escapeHtml(cat)}
          </button>
        `).join("");

        pillsContainer.querySelectorAll("[data-category]").forEach(btn => {
          btn.addEventListener("click", () => {
            activeCategory = btn.getAttribute("data-category");
            renderPills();
            renderList();
          });
        });
      }

      function renderList() {
        const filtered = activeCategory === "Semua" ? allServices : allServices.filter(s => s.category === activeCategory);

        if (!filtered.length) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--c-muted);padding:40px;">Tidak ada layanan pada kategori ini.</p>';
          return;
        }

        grid.innerHTML = filtered.map(s => `
          <div class="card">
            <div style="position:relative;aspect-ratio:16/10;overflow:hidden;background:#ece4d8;">
              <img src="${window.escapeHtml(s.image)}" alt="${window.escapeHtml(s.name)}" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'placeholder-img\\'>Foto contoh</div>';" loading="lazy">
              <span class="badge badge-outline" style="position:absolute;top:14px;left:14px;background:rgba(255,255,255,0.9);">${window.escapeHtml(s.category)}</span>
            </div>
            <div class="card-body">
              <h3 class="card-title">${window.escapeHtml(s.name)}</h3>
              <p class="card-text">${window.escapeHtml(s.description)}</p>
              <div style="margin-top:auto;">
                <a href="layanan-detail.html?slug=${s.slug}" class="btn btn-secondary btn-sm" style="width:100%;">
                  Detail & Ajukan Permintaan
                </a>
              </div>
            </div>
          </div>
        `).join("");
      }

      renderPills();
      renderList();
    });
  </script>
</body>
</html>
