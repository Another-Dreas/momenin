<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momenin — Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header id="site-header"></header>

<div class="app-layout">
  <aside class="sidebar">
    <ul class="sidebar-nav">
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="dashboard.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="proyek.html"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2-2h9a2 2 0 0 1 2 2z"/><path d="M1 13v4a2 2 0 0 0 2 2h4"/><path d="M12 11V7"/></svg><span>Proyek Saya</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="album.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="2"/><path d="M21 15l-5-5L5 21"/></svg><span>Album</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="penyimpanan.html"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Penyimpanan</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="paket-saya.html"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Paket Saya</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="transaksi.html"><svg viewBox="0 0 24 24"><path d="M21 12a2 2 0 0 0-2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 0-2-2H3"/><path d="M12 6v12"/><path d="M12 6s0-2 1.5-2S15 6 12 6z"/><path d="M12 6s0-2-1.5-2S9 6 12 6z"/></svg><span>Transaksi</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="pemesanan.html"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 8.3L12 13l8.7-4.7"/><path d="M12 13V21"/></svg><span>Permintaan</span></a></li>
      <li class="sidebar-nav-item"><a class="sidebar-nav-link" href="profil.html"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a></li>
    </ul>
  </aside>

  <div class="app-main">
    <div id="content">
      <div class="section-header">
        <h2 class="section-title">Dashboard</h2>
        <p class="section-desc">Ringkasan proyek, album, dan pemakaian storage Anda.</p>
      </div>

      <div class="stats-grid" id="dashboard-stats">
        <div class="skeleton"><div style="height:80px;border-radius:10px;"></div></div>
        <div class="skeleton"><div style="height:80px;border-radius:10px;"></div></div>
        <div class="skeleton"><div style="height:80px;border-radius:10px;"></div></div>
        <div class="skeleton"><div style="height:80px;border-radius:10px;"></div></div>
      </div>

      <h3 class="mt-32" style="margin-top:32px;">Proyek Terbaru</h3>
      <div class="grid grid-3" id="dashboard-projects">
        <!-- skeleton -->
        <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-title"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container"></div>

<script src="../js/data.js"></script><script src="../js/store.js"></script><script src="../js/auth.js"></script><script src="../js/ui.js"></script><script src="../js/layout.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const session = auth.getSession();
  const user = auth.getCurrentUser();
  const userId = session?.userId || (user && user.id);
  if (!user || user.role !== "user") {
    location.href = "../login.html?next=" + encodeURIComponent(location.pathname);
    return;
  }

  const statsGrid = document.getElementById("dashboard-stats");
  const projectsGrid = document.getElementById("dashboard-projects");

  const projects = store.getAll({ type: "projects" }).filter(p => p.memberIds.includes(userId));
  const albums = store.getAll({ type: "albums" }).filter(a => a.projectId && projects.some(p => p.id === a.projectId));
  const files = store.getAll({ type: "files" }).filter(f => f.userId === userId);
  const subs = store.getAll({ type: "subscriptions" }).filter(s => s.userId === userId);
  const payments = store.getAll({ type: "payments" }).filter(p => p.userId === userId);
  const folders = store.getAll({ type: "folders" }).filter(f => f.userId === userId);

  // Storage usage
  let usedBytes = 0;
  files.forEach(f => { usedBytes += f.sizeBytes; });
  let plan = subs.find(s => s.userId === userId);
  let planQuota = 0;
  if (plan) {
    const sp = store.getById({ type: "storagePlans" }, plan.planId);
    planQuota = sp ? sp.quotaBytes : 0;
  }

  statsGrid.innerHTML = `
    <div class="stat-card"><div class="stat-value">${projects.length}</div><div class="stat-label">Proyek Aktif</div></div>
    <div class="stat-card"><div class="stat-value">${albums.length}</div><div class="stat-label">Album</div></div>
    <div class="stat-card"><div class="stat-value">${formatBytes(planQuota - usedBytes)}</div><div class="stat-label">Sisa Kuota Storage</div></div>
    <div class="stat-card"><div class="stat-value">${payments.length}</div><div class="stat-label">Transaksi</div></div>`;

  projectsGrid.innerHTML = "";
  if (!projects.length) {
    projectsGrid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;text-align:center;color:var(--c-muted);">Belum ada proyek. Ajukan layanan untuk memulai.</p>';
  } else {
    projects.forEach(p => {
      projectsGrid.innerHTML += `
        <div class="card">
          <div class="card-body">
            <div class="badge ${p.status === "selesai" ? "badge-success" : p.status === "berjalan" ? "badge-info" : "badge-warning"} mb-3">${escapeHtml(p.status)}</div>
            <h3 class="card-title">${escapeHtml(p.name)}</h3>
            <p class="card-text">${escapeHtml(p.eventType)} · ${escapeHtml(p.location)} · ${formatDate(p.eventDate)}</p>
            <a href="proyek-detail.html?id=${p.id}" class="btn btn-secondary btn-sm">Detail</a>
          </div>
        </div>`;
    });
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 GB";
    const gb = bytes / (1024 * 1024 * 1024);
    return gb >= 1 ? gb.toFixed(1) + " GB" : Math.round(gb * 1024 * 1024) + " MB";
  }
});
</script>
</body>
</html>
